<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chat Hub</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f0f10;
      color: #fff;
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 12px 16px;
      background: #1a1a1d;
      font-weight: bold;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }
    .msg {
      margin-bottom: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      max-width: 70%;
      word-wrap: break-word;
    }
    .user { background: #2563eb; margin-left: auto; }
    .bot { background: #2a2a2e; }
    footer {
      display: flex;
      padding: 12px;
      background: #1a1a1d;
      gap: 8px;
    }
    select, input, button {
      padding: 8px;
      border-radius: 6px;
      border: none;
      outline: none;
    }
    input { flex: 1; background: #2a2a2e; color: white; }
    button { background: #2563eb; color: white; cursor: pointer; font-weight: bold; }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>

<header>AI Chat Hub</header>

<div id="chat"></div>

<footer>
  <select id="provider">
    <option value="gemini">Gemini</option>
    <option value="grok">Grok</option>
    <option value="openai">ChatGPT</option>
  </select>
  <input id="input" placeholder="Type a message..." autocomplete="off" />
  <button id="sendBtn">Send</button>
</footer>

<script>
  const chat = document.getElementById("chat");
  const input = document.getElementById("input");
  const providerSelect = document.getElementById("provider");
  const sendBtn = document.getElementById("sendBtn");

  function addMessage(text, sender) {
    const div = document.createElement("div");
    div.className = "msg " + sender;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  async function send() {
    const provider = providerSelect.value;
    const text = input.value.trim();
    if (!text) return;

    // 1. Add User Message
    addMessage(text, "user");
    input.value = "";

    // 2. Add Thinking Placeholder
    const botMsgDiv = addMessage(`${provider} is thinking...`, "bot");

    try {
      // 3. Call your Cloudflare Worker
      const response = await fetch("https://xai-grok-chathub.trungb1601.workers.dev/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ provider, message: text })
      });

      const data = await response.json();

      // 4. Handle Errors from Worker or AI
      if (data.error) {
        botMsgDiv.textContent = "Error: " + JSON.stringify(data.error);
        botMsgDiv.style.color = "#ff4a4a";
        return;
      }

      // 5. Parse Successful Response
      let aiResponse = "";
      if (provider === "gemini") {
        aiResponse = data.candidates[0].content.parts[0].text;
      } else {
        // Works for Grok and OpenAI
        aiResponse = data.choices[0].message.content;
      }

      botMsgDiv.textContent = aiResponse;

    } catch (err) {
      botMsgDiv.textContent = "Worker Error: " + err.message;
      botMsgDiv.style.color = "#ff4a4a";
    }
  }

  // Event Listeners
  sendBtn.addEventListener("click", send);
  input.addEventListener("keypress", (e) => {
    if (e.key === "Enter") send();
  });
</script>

</body>
</html>
