<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Hub</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <style>
    :root {
      --bg-main: #131314;
      --bg-sidebar: #1e1f20;
      --txt-main: #e3e3e3;
      --blue-accent: #8ab4f8;
      --user-bubble: #2b2d31;
      --bot-bubble: #5c6fa3; 
    }

    body {
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
      background: var(--bg-main);
      color: var(--txt-main);
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      align-items: center;
    }

    header {
      width: 100%;
      padding: 16px 24px;
      font-size: 20px;
      font-weight: 500;
      color: var(--blue-accent);
      border-bottom: 1px solid #333;
      box-sizing: border-box;
    }

    #chat-container {
      flex: 1;
      width: 100%;
      /* Adjusting container to allow bubbles to move inward from edges */
      max-width: 1200px; 
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .msg {
      max-width: 75%; 
      /* Tightened padding to match user bubble height */
      padding: 10px 18px; 
      line-height: 1.5;
      font-size: 15px;
      border-radius: 18px;
      white-space: pre-wrap;
      position: relative;
    }

    .user {
      background: var(--user-bubble);
      align-self: flex-end;
      border-bottom-right-radius: 4px;
      /* Move user bubble 500px away from the right edge on large screens */
      margin-right: min(500px, 10%);
    }

    .bot {
      background: var(--bot-bubble);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      /* Move AI bubble 500px away from the left edge on large screens */
      margin-left: min(500px, 10%);
    }

    /* Remove extra spacing from Markdown blocks inside AI bubbles */
    .bot p { margin: 0; }
    .bot p + p { margin-top: 10px; }
    
    .bot pre {
      background: #00000050;
      border: 1px solid #ffffff30;
      border-radius: 10px;
      padding: 12px;
      margin: 8px 0;
    }
    
    .copy-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      background: #ffffff20;
      color: #fff;
      border: none;
      padding: 3px 8px;
      font-size: 10px;
      border-radius: 4px;
      cursor: pointer;
    }

    footer {
      width: 100%;
      padding: 20px;
      display: flex;
      justify-content: center;
      background: var(--bg-main);
      box-sizing: border-box;
    }

    .input-container {
      width: 100%;
      max-width: 700px; 
      background: var(--bg-sidebar);
      border-radius: 30px;
      display: flex;
      align-items: center;
      padding: 4px 16px;
      border: 1px solid #444;
    }

    select {
      background: none;
      color: var(--blue-accent);
      border: none;
      font-weight: bold;
      outline: none;
      cursor: pointer;
    }

    input {
      flex: 1;
      background: none;
      border: none;
      color: white;
      padding: 12px;
      font-size: 16px;
      outline: none;
    }

    #sendBtn {
      background: none;
      border: none;
      color: var(--blue-accent);
      font-size: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<header>Gemini Hub</header>

<div id="chat-container">
  <div id="chat"></div>
</div>

<footer>
  <div class="input-container">
    <select id="provider">
      <option value="gemini">Gemini</option>
      <option value="grok">Grok</option>
      <option value="openai">GPT-4o</option>
    </select>
    <input id="input" placeholder="Type a message..." autocomplete="off" />
    <button id="sendBtn">➤</button>
  </div>
</footer>

<script>
  marked.setOptions({
    highlight: function(code) { return hljs.highlightAuto(code).value; }
  });

  const chat = document.getElementById("chat");
  const input = document.getElementById("input");
  const providerSelect = document.getElementById("provider");
  const sendBtn = document.getElementById("sendBtn");

  function addMessage(content, sender) {
    const div = document.createElement("div");
    div.className = "msg " + sender;
    
    if (sender === "user") {
      div.textContent = content;
    } else {
      div.innerHTML = marked.parse(content);
      setupCodeBlocks(div);
    }
    
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function setupCodeBlocks(container) {
    container.querySelectorAll('pre').forEach(block => {
      const btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.innerText = 'Copy';
      btn.onclick = () => {
        navigator.clipboard.writeText(block.querySelector('code')?.innerText || block.innerText.replace('Copy', ''));
        btn.innerText = 'Copied!';
        setTimeout(() => btn.innerText = 'Copy', 2000);
      };
      block.appendChild(btn);
    });
  }

  async function send() {
    const provider = providerSelect.value;
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, "user");
    input.value = "";
    
    const botMsgDiv = addMessage("Thinking...", "bot");

    try {
      const response = await fetch("https://xai-grok-chathub.trungb1601.workers.dev/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ provider, message: text })
      });

      const data = await response.json();
      let aiResponse = provider === "gemini" 
        ? data.candidates[0].content.parts[0].text 
        : data.choices[0].message.content;

      botMsgDiv.innerHTML = marked.parse(aiResponse);
      setupCodeBlocks(botMsgDiv);

    } catch (err) {
      botMsgDiv.innerHTML = `<span style="color:#ffbaba">Error: Check connection.</span>`;
    }
  }

  sendBtn.addEventListener("click", send);
  input.addEventListener("keypress", (e) => { if (e.key === "Enter") send(); });
</script>

</body>
</html>
