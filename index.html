<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Chat Hub</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f0f10;
      color: #fff;
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 12px 16px;
      background: #1a1a1d;
      font-weight: bold;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }
    .msg {
      margin-bottom: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      max-width: 70%;
    }
    .user { background: #2563eb; margin-left: auto; }
    .bot { background: #2a2a2e; }
    footer {
      display: flex;
      padding: 12px;
      background: #1a1a1d;
      gap: 8px;
    }
    select, input, button {
      padding: 8px;
      border-radius: 6px;
      border: none;
    }
    input { flex: 1; }
    button { background: #2563eb; color: white; cursor: pointer; }
  </style>
</head>
<body>

<header>AI Chat Hub</header>

<div id="chat"></div>

<footer>
  <select id="provider">
    <option value="openai">ChatGPT</option>
    <option value="gemini">Gemini</option>
  </select>
  <input id="input" placeholder="Type a message..." />
  <button onclick="send()">Send</button>
</footer>

<script>
  const chat = document.getElementById("chat");

  function addMessage(text, sender) {
    const div = document.createElement("div");
    div.className = "msg " + sender;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function send() {
    const input = document.getElementById("input");
    const provider = document.getElementById("provider").value;
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, "user");
    input.value = "";

    // Placeholder response (API will come later)
    setTimeout(() => {
      addMessage(`(${provider}) response will appear here.`, "bot");
    }, 500);
  }
</script>

</body>
</html>
