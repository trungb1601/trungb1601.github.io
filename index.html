<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Chat Hub</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f0f10;
      color: #fff;
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 12px 16px;
      background: #1a1a1d;
      font-weight: bold;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }
    .msg {
      margin-bottom: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      max-width: 70%;
    }
    .user { background: #2563eb; margin-left: auto; }
    .bot { background: #2a2a2e; }
    footer {
      display: flex;
      padding: 12px;
      background: #1a1a1d;
      gap: 8px;
    }
    select, input, button {
      padding: 8px;
      border-radius: 6px;
      border: none;
    }
    input { flex: 1; }
    button { background: #2563eb; color: white; cursor: pointer; }
  </style>
</head>
<body>

<header>AI Chat Hub</header>

<div id="chat"></div>

<footer>
  <select id="provider">
    <option value="openai">ChatGPT</option>
    <option value="gemini">Gemini</option>
    <option value="grok">Grok</option>
  </select>
  <input id="input" placeholder="Type a message..." />
  <button onclick="send()">Send</button>
</footer>

<script>
  const chat = document.getElementById("chat");
  const input = document.getElementById("input");
  const providerSelect = document.getElementById("provider");

  function addMessage(text, sender) {
    const div = document.createElement("div");
    div.className = "msg " + sender;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div; // Return the element so we can update it if needed
  }

  async function send() {
    const provider = providerSelect.value;
    const text = input.value.trim();
    
    if (!text) return;

    // 1. Show user message
    addMessage(text, "user");
    input.value = "";

    // 2. Show a temporary "Thinking..." message
    const botMsgDiv = addMessage(`${provider} is thinking...`, "bot");

    try {
      // 3. Call your Cloudflare Worker
      const response = await fetch("https://xai-grok-chathub.trungb1601.workers.dev/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          provider: provider,
          message: text
        })
      });

      const data = await response.json();

      // 4. Handle errors from the Worker
      if (data.error) {
        botMsgDiv.textContent = "Error: " + data.error;
        return;
      }

      // 5. Extract the text based on which AI responded
      let aiResponse = "";
      if (provider === "gemini") {
        aiResponse = data.candidates[0].content.parts[0].text;
      } else {
        // Works for both Grok and ChatGPT (OpenAI format)
        aiResponse = data.choices[0].message.content;
      }

      botMsgDiv.textContent = aiResponse;

    } // Change this line inside the try/catch in your script:
if (data.error) {
  botMsgDiv.textContent = "Error: " + JSON.stringify(data.error); // This stringifies the object
  return;
}
        ;
    }
  }

  // Allow pressing "Enter" to send
  input.addEventListener("keypress", (e) => {
    if (e.key === "Enter") send();
  });
</script>

</body>
</html>
