<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chat Hub</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <style>
    :root {
      --bg-main: #131314;
      --bg-sidebar: #1e1f20;
      --txt-main: #e3e3e3;
      --blue-accent: #8ab4f8;
      --user-bubble: #2b2d31;
      --bot-bubble: #5c6fa3; 
      --status-green: #4caf50;
      --status-orange: #ff9800;
      --status-red: #f44336;
    }

    body {
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
      background: var(--bg-main);
      color: var(--txt-main);
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      align-items: center;
    }

    header {
      width: 100%;
      padding: 16px 24px;
      font-size: 18px;
      font-weight: 500;
      color: var(--blue-accent);
      border-bottom: 1px solid #333;
      box-sizing: border-box;
    }

    #chat-container {
      flex: 1;
      width: 100%;
      max-width: 1800px; 
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      max-width: 70%; 
      padding: 10px 18px; 
      line-height: 1.5;
      font-size: 15px;
      border-radius: 18px;
      position: relative;
    }

    .user {
      background: var(--user-bubble);
      align-self: flex-end;
      border-bottom-right-radius: 4px;
      margin-right: min(500px, 15%);
    }

    .bot {
      background: var(--bot-bubble);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      margin-left: min(500px, 15%);
    }

    .bot * { margin: 0 !important; }
    .bot p + p, .bot ul, .bot ol, .bot pre { margin-top: 10px !important; }

    /* Status Indicator Styling */
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-left: 8px;
      background-color: var(--status-red); /* Default to not connected */
      box-shadow: 0 0 5px rgba(0,0,0,0.5);
      transition: background-color 0.3s ease;
    }

    footer {
      width: 100%;
      padding: 24px;
      display: flex;
      justify-content: center;
      background: var(--bg-main);
      box-sizing: border-box;
    }

    .input-container {
      width: 100%;
      max-width: 750px; 
      background: var(--bg-sidebar);
      border-radius: 30px;
      display: flex;
      align-items: center;
      padding: 4px 18px;
      border: 1px solid #444;
    }

    .provider-wrapper {
      display: flex;
      align-items: center;
      border-right: 1px solid #444;
      padding-right: 12px;
      margin-right: 8px;
    }

    select {
      background: none;
      color: var(--blue-accent);
      border: none;
      font-weight: bold;
      outline: none;
      cursor: pointer;
      font-size: 14px;
    }

    input {
      flex: 1;
      background: none;
      border: none;
      color: white;
      padding: 12px;
      font-size: 16px;
      outline: none;
    }

    #sendBtn {
      background: none;
      border: none;
      color: var(--blue-accent);
      font-size: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<header>AI Chat Hub</header>

<div id="chat-container">
  <div id="chat"></div>
</div>

<footer>
  <div class="input-container">
    <div class="provider-wrapper">
      <select id="provider">
        <option value="gemini">Gemini</option>
        <option value="grok">Grok</option>
        <option value="openai">GPT-4o</option>
      </select>
      <span id="statusIndicator" class="status-dot"></span>
    </div>
    <input id="input" placeholder="Type a message..." autocomplete="off" />
    <button id="sendBtn">➤</button>
  </div>
</footer>

<script>
  const chat = document.getElementById("chat");
  const input = document.getElementById("input");
  const providerSelect = document.getElementById("provider");
  const sendBtn = document.getElementById("sendBtn");
  const statusIndicator = document.getElementById("statusIndicator");

  // Function to update status color
  function updateStatus(state) {
    if (state === 'connected') statusIndicator.style.backgroundColor = 'var(--status-green)';
    else if (state === 'error') statusIndicator.style.backgroundColor = 'var(--status-orange)';
    else statusIndicator.style.backgroundColor = 'var(--status-red)';
  }

  // Initial check
  window.addEventListener('online', () => updateStatus('connected'));
  window.addEventListener('offline', () => updateStatus('disconnected'));
  updateStatus(navigator.onLine ? 'connected' : 'disconnected');

  marked.setOptions({
    highlight: function(code) { return hljs.highlightAuto(code).value; }
  });

  function addMessage(content, sender) {
    const div = document.createElement("div");
    div.className = "msg " + sender;
    if (sender === "user") div.textContent = content;
    else div.innerHTML = marked.parse(content);
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  async function send() {
    const provider = providerSelect.value;
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, "user");
    input.value = "";
    const botMsgDiv = addMessage("Thinking...", "bot");

    try {
      const response = await fetch("https://xai-grok-chathub.trungb1601.workers.dev/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ provider, message: text })
      });

      if (!response.ok) throw new Error("API Error");

      const data = await response.json();
      let aiResponse = provider === "gemini" 
        ? data.candidates[0].content.parts[0].text 
        : data.choices[0].message.content;

      botMsgDiv.innerHTML = marked.parse(aiResponse);
      updateStatus('connected');

    } catch (err) {
      botMsgDiv.innerHTML = `<span style="color:#ffbaba">Connection Error.</span>`;
      updateStatus('error');
    }
  }

  sendBtn.addEventListener("click", send);
  input.addEventListener("keypress", (e) => { if (e.key === "Enter") send(); });
</script>

</body>
</html>
