<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Hub</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <style>
    :root {
      --bg-main: #131314;
      --bg-sidebar: #1e1f20;
      --txt-main: #e3e3e3;
      --blue-accent: #8ab4f8;
      --bot-bubble: #222427;
    }

    body {
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
      background: var(--bg-main);
      color: var(--txt-main);
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      padding: 16px 24px;
      font-size: 20px;
      font-weight: 500;
      color: var(--blue-accent);
      border-bottom: 1px solid #333;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .msg {
      max-width: 85%;
      padding: 12px 18px;
      line-height: 1.6;
      font-size: 15px;
      border-radius: 18px;
      white-space: pre-wrap;
    }

    .user {
      background: #2b2d31;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .bot {
      background: transparent;
      align-self: flex-start;
      padding: 0; /* Let markdown handle padding */
      width: 100%;
    }

    /* Markdown Styling */
    .bot p { margin: 0 0 16px 0; }
    .bot pre {
      background: #000;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 16px;
      overflow-x: auto;
      position: relative;
    }
    .bot code { font-family: 'Consolas', monospace; color: #f8f8f2; }
    
    .copy-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #333;
      color: #ccc;
      border: none;
      padding: 4px 8px;
      font-size: 11px;
      border-radius: 4px;
      cursor: pointer;
    }

    footer {
      padding: 20px;
      display: flex;
      justify-content: center;
      background: var(--bg-main);
    }

    .input-container {
      width: 100%;
      max-width: 800px;
      background: var(--bg-sidebar);
      border-radius: 30px;
      display: flex;
      align-items: center;
      padding: 6px 16px;
      border: 1px solid #444;
    }

    select {
      background: none;
      color: var(--blue-accent);
      border: none;
      font-weight: bold;
      margin-right: 10px;
      cursor: pointer;
      outline: none;
    }

    input {
      flex: 1;
      background: none;
      border: none;
      color: white;
      padding: 12px;
      font-size: 16px;
      outline: none;
    }

    #sendBtn {
      background: none;
      border: none;
      color: var(--blue-accent);
      font-size: 24px;
      cursor: pointer;
      padding: 0 10px;
    }
  </style>
</head>
<body>

<header>Gemini Hub</header>

<div id="chat"></div>

<footer>
  <div class="input-container">
    <select id="provider">
      <option value="gemini">Gemini</option>
      <option value="grok">Grok</option>
      <option value="openai">GPT-4o</option>
    </select>
    <input id="input" placeholder="Enter a prompt here" autocomplete="off" />
    <button id="sendBtn">➤</button>
  </div>
</footer>

<script>
  // Configure Marked to use Highlight.js
  marked.setOptions({
    highlight: function(code, lang) {
      return hljs.highlightAuto(code).value;
    }
  });

  const chat = document.getElementById("chat");
  const input = document.getElementById("input");
  const providerSelect = document.getElementById("provider");
  const sendBtn = document.getElementById("sendBtn");

  function addMessage(content, sender) {
    const div = document.createElement("div");
    div.className = "msg " + sender;
    
    if (sender === "user") {
      div.textContent = content;
    } else {
      // Create a container that looks cleaner
      div.innerHTML = marked.parse(content);
      
      // Add Copy buttons to all code blocks
      div.querySelectorAll('pre').forEach(block => {
        const btn = document.createElement('button');
        btn.className = 'copy-btn';
        btn.innerText = 'Copy';
        btn.onclick = () => {
          navigator.clipboard.writeText(block.innerText.replace('Copy', ''));
          btn.innerText = 'Copied!';
          setTimeout(() => btn.innerText = 'Copy', 2000);
        };
        block.appendChild(btn);
      });
    }
    
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  async function send() {
    const provider = providerSelect.value;
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, "user");
    input.value = "";
    
    const botMsgDiv = addMessage("...", "bot");

    try {
      const response = await fetch("https://xai-grok-chathub.trungb1601.workers.dev/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ provider, message: text })
      });

      const data = await response.json();
      if (data.error) throw new Error(JSON.stringify(data.error));

      let aiResponse = provider === "gemini" 
        ? data.candidates[0].content.parts[0].text 
        : data.choices[0].message.content;

      botMsgDiv.innerHTML = marked.parse(aiResponse);
      
      // Re-trigger copy button logic for new message
      botMsgDiv.querySelectorAll('pre').forEach(block => {
          const btn = document.createElement('button');
          btn.className = 'copy-btn';
          btn.innerText = 'Copy';
          btn.onclick = () => {
            navigator.clipboard.writeText(block.innerText.replace('Copy', ''));
            btn.innerText = 'Copied!';
            setTimeout(() => btn.innerText = 'Copy', 2000);
          };
          block.appendChild(btn);
      });

    } catch (err) {
      botMsgDiv.innerHTML = `<span style="color:#ff4a4a">Error: ${err.message}</span>`;
    }
  }

  sendBtn.addEventListener("click", send);
  input.addEventListener("keypress", (e) => { if (e.key === "Enter") send(); });
</script>

</body>
</html>
